# Reproducible local deployment for the University Portal.
#
# Usage:
#   $env:SESSION_SECRET = "a-long-random-value"
#   docker compose up --build -d
#   docker compose --profile tools run --rm seed   # optional demo data
#
# The app is served at http://localhost:3000 and exposes /api/health.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fyp_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fyp_project"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/fyp_project?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/fyp_project?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting the deployment}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Optional demo accounts and reference data.
  seed:
    profiles: ["tools"]
    build:
      context: .
      target: migrator
    command: ["npx", "prisma", "db", "seed"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/fyp_project?schema=public
      SEED_PASSWORD: ${SEED_PASSWORD:-PortalDemo2026!}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
